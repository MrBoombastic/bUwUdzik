name: Build and Publish Canary APK

permissions:
  contents: write

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check versionCode change
        id: check
        run: |
          CURR_VERSION=$(grep "versionCode =" app/build.gradle.kts | sed 's/.*versionCode = //')
          
          # Check if there is a parent commit
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            PREV_VERSION=$(git show HEAD^:app/build.gradle.kts | grep "versionCode =" | sed 's/.*versionCode = //')
          else
            PREV_VERSION="none"
          fi
          
          echo "Current versionCode: $CURR_VERSION"
          echo "Previous versionCode: $PREV_VERSION"
          
          if [ "$CURR_VERSION" = "$PREV_VERSION" ]; then
            echo "versionCode didn't change. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "versionCode changed. Proceeding."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  canary:
    needs: check-version
    if: needs.check-version.outputs.skip != 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "jetbrains"
          java-version: "25"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Restore configuration cache
        uses: actions/cache@v5
        with:
          path: .gradle/configuration-cache
          key: ${{ runner.os }}-cc-canary-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-cc-canary-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        run: yes | sdkmanager "build-tools;36.0.0"

      - name: Build Canary APK (canary flavor)
        run: ./gradlew --no-daemon --build-cache --configuration-cache -PCANARY_BUILD=${{ github.run_number }} assembleCanaryDebug

      - name: Sign Canary APK
        id: sign_apk
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/apk/canary/debug
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename signed APK
        run: |
          output="app/build/outputs/apk/canary/debug/clOwOck-canary-debug-${GITHUB_SHA::7}.apk"
          mv "${{ steps.sign_apk.outputs.signedFile }}" "$output"
          echo "SIGNED_APK_PATH=$output" >> "$GITHUB_ENV"

      - name: Prepare canary release metadata
        run: |
          short_sha="${GITHUB_SHA::7}"
          app_version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          canary_version="${app_version}-canary.${GITHUB_RUN_NUMBER}"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          echo "CANARY_VERSION=$canary_version" >> "$GITHUB_ENV"
          echo "CANARY_TAG=v$canary_version" >> "$GITHUB_ENV"

      - name: Publish/Update rolling canary prerelease
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.CANARY_TAG }}
          name: Canary ${{ env.CANARY_VERSION }}
          body: |
            Auto-published canary build from the `master` branch. Uses different namespace, so you can use both canary and stable simultaneously.
            Commit: ${{ github.sha }}
          prerelease: true
          artifacts: ${{ env.SIGNED_APK_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unsigned Canary APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-canary-apk
          path: app/build/outputs/apk/canary/debug/*-unsigned.apk
